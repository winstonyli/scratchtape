# Timeboxed spike (2026-09-24): can one cubecl kernel source serve both the
# eGPU (wgpu DX12/Vulkan) and a multithreaded CPU (cubecl's LLVM-JIT CPU
# runtime) well enough to build scratchtape's device-resident training step
# on? Kept out of the main crate so its dependency tree (cubecl pre-release,
# wgpu 30, bundled LLVM) doesn't touch scratchtape unless adopted.
# Pinned to 0.11.0-pre.4 (see PATCHES.md for the pre.3 -> pre.4 move).
[package]
name = "cubecl_spike"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[features]
# The CPU runtime's build script downloads a prebuilt LLVM (~77 MB).
cpu = ["cubecl/cpu"]
# cubecl's own SPIR-V compiler for the Vulkan backend (instead of WGSL via
# naga); the path that queries VK_KHR_cooperative_matrix (matrix cores).
vulkan = ["cubecl/vulkan"]

[dependencies]
cubecl = { version = "=0.11.0-pre.4", features = ["wgpu"] }
scratchtape = { path = "../.." }
half = "2"
# pre.4 no longer re-exports the Runtime trait (needed for WgpuRuntime::client).
cubecl-runtime = "=0.11.0-pre.4"

[profile.release]
opt-level = 3

# Local fix for the CPU runtime's Windows build: LLVM library paths with a
# space break the bundler (PATCHES.md). Spike-only.
[patch.crates-io]
tracel-llvm-bundler = { path = "patches/tracel-llvm-bundler" }
