[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "matmul"
harness = false

[[bench]]
name = "transformer_block"
harness = false

# Release optimizations + debug symbols kept in, so `samply record` gets
# symbolized stacks instead of addresses. Build with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
